[package]
name = "pubrel"
version = "0.5.4"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Version packages by what changed, and record each release as a version of a package publet."
repository = "https://github.com/schryer/pubrel"
# A binary-only crate gets no docs.rs pages: the README is its documentation.
documentation = "https://github.com/schryer/pubrel#readme"
keywords = ["release", "versioning", "changelog", "semver", "publet"]
categories = ["development-tools", "command-line-utilities"]
# Anchored with /: like gitignore patterns, a bare name matches at any depth.
include = ["/src/**/*.rs", "/README.md", "/CHANGELOG.md", "/LICENSE", "/SECURITY.md", "/SUPPLY-CHAIN.md"]

[[bin]]
name = "pubrel"
path = "src/main.rs"

[dependencies]
# Canonical CBOR, content identifiers and Ed25519: enough to read the
# package publet back and check its signature, without the `pub` binary.
publet-core = "0.1.4"
semver = "1"
serde_json = "1"
toml_edit = "0.22"

[profile.release]
overflow-checks = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
