
# cargo-vet config file

[cargo-vet]
version = "0.10"

[imports.bytecode-alliance]
url = "https://raw.githubusercontent.com/bytecodealliance/wasmtime/main/supply-chain/audits.toml"

[imports.embark-studios]
url = "https://raw.githubusercontent.com/EmbarkStudios/rust-ecosystem/main/audits.toml"

[imports.google]
url = "https://raw.githubusercontent.com/google/supply-chain/main/audits.toml"

[imports.isrg]
url = "https://raw.githubusercontent.com/divviup/libprio-rs/main/supply-chain/audits.toml"

[imports.mozilla]
url = "https://raw.githubusercontent.com/mozilla/supply-chain/main/audits.toml"

[imports.zcash]
url = "https://raw.githubusercontent.com/zcash/rust-ecosystem/main/supply-chain/audits.toml"

[policy.pubrel]
audit-as-crates-io = false

[[exemptions.block-buffer]]
version = "0.12.1"
criteria = "safe-to-deploy"
notes = "Ships in pubrel through publet-core 0.1.4 (via digest, for sha2 0.11 and ed25519-dalek 3); replaces 0.10.4, which has GHSA-qwgh-2vcv-g2f7. Imported audits chain to 0.10.4 (Zcash crypto-reviewed delta 0.10.3 to 0.10.4); nothing covers 0.10.4 to 0.12.1 (9 files, +964/-281). 22 unsafe uses in src. No advisory against 0.12.1. As of 2026-10-28. Review by 2027-01-28."

[[exemptions.cfg-if]]
version = "1.0.5"
criteria = "safe-to-deploy"
notes = "Imported audits as of 2026-10-09 reach 1.0.4 (full audits by Google and the Bytecode Alliance, deltas by ISRG); the 1.0.4 to 1.0.5 diff is not audited in any imported set."

[[exemptions.const-oid]]
version = "0.10.2"
criteria = "safe-to-deploy"
notes = "Ships in pubrel through publet-core 0.1.4 (via digest 0.11). No audit of any version in any cargo-vet registry set; 0.9.6 was exempt. Diff from 0.9.6: 20 files, +2426/-489. 1 unsafe use; the crate otherwise denies unsafe_code. No advisory. As of 2026-10-28. Review by 2027-01-28."

[[exemptions.crypto-common]]
version = "0.2.2"
criteria = "safe-to-deploy"
notes = "Ships in pubrel through publet-core 0.1.4 (via digest 0.11). Imported audits cover up to 0.1.6 (Zcash crypto-reviewed); nothing covers 0.1.7 to 0.2.2 (8 files, +775/-138). forbid(unsafe_code). No advisory. As of 2026-10-28. Review by 2027-01-28."

[[exemptions.curve25519-dalek]]
version = "5.0.0"
criteria = "safe-to-deploy"
notes = "Ships in pubrel through publet-core 0.1.4 (via ed25519-dalek 3). Zcash's crypto-reviewed deltas reach 4.1.3 without a full base audit; nothing covers 4.1.3 to 5.0.0 (62 files, +4031/-1157). 38 unsafe uses in src (SIMD backends) and a build.rs. No advisory against 5.0.0 (RUSTSEC-2024-0344 is fixed from 4.1.3). As of 2026-10-28. Review by 2027-01-28."

[[exemptions.curve25519-dalek-derive]]
version = "0.1.1"
criteria = "safe-to-deploy"
notes = "Google audited 0.1.0 (ub-risk-3, does-not-implement-crypto) and Zcash published a crypto-reviewed delta 0.1.0 to 0.1.1, but no registry set audits 0.1.0 as safe-to-deploy. As of 2026-10-05."

[[exemptions.digest]]
version = "0.11.3"
criteria = "safe-to-deploy"
notes = "Ships in pubrel through publet-core 0.1.4 (via sha2 0.11). Imported deltas chain from 0.9.0 to 0.10.7 without a full base audit; nothing covers 0.10.7 to 0.11.3 (27 files, +2206/-1248). forbid(unsafe_code). No advisory. As of 2026-10-28. Review by 2027-01-28."

[[exemptions.ed25519]]
version = "3.0.0"
criteria = "safe-to-deploy"
notes = "Ships in pubrel through publet-core 0.1.4 (via ed25519-dalek 3). Zcash's crypto-reviewed deltas reach 2.2.3 without a full base audit; nothing covers 2.2.3 to 3.0.0 (12 files, +297/-327). forbid(unsafe_code). No advisory. As of 2026-10-28. Review by 2027-01-28."

[[exemptions.ed25519-dalek]]
version = "3.0.0"
criteria = "safe-to-deploy"
notes = "Ships in pubrel through publet-core 0.1.4, which checks the package publet's signatures with it. No audit of any version in any cargo-vet registry set; 2.2.0 was exempt. Diff from 2.2.0: 18 files, +813/-293. 4 unsafe uses in src. No advisory against 3.0.0 (RUSTSEC-2022-0093 is fixed from 2.0). As of 2026-10-28. Review by 2027-01-28."

[[exemptions.hashbrown]]
version = "0.17.1"
criteria = "safe-to-deploy"
notes = "Mozilla audits the deltas from 0.16.0 up to this version, but in the imported sets as of 2026-10-09 the chain from a full audit stops at 0.14.0."

[[exemptions.hybrid-array]]
version = "0.4.15"
criteria = "safe-to-deploy"
notes = "Ships in pubrel through publet-core 0.1.4 (via block-buffer and crypto-common, replacing generic-array). Google audited 0.4.7 for undefined-behaviour risk only (ub-risk-1); no safe-to-deploy audit of any version. 4817 lines; 43 unsafe uses in src. No advisory. As of 2026-10-28. Review by 2027-01-28."

[[exemptions.indexmap]]
version = "2.14.2"
criteria = "safe-to-deploy"
notes = "Imported audits as of 2026-10-09 reach 2.14.0 (Google, Mozilla, Zcash); the 2.14.0 to 2.14.2 diff is not audited in any imported set."

[[exemptions.libc]]
version = "0.2.190"
criteria = "safe-to-deploy"
notes = "Built only on targets where cpufeatures needs it (aarch64 Linux, for sha2), not on x86_64. No full audit in the imported sets as of 2026-10-09; Mozilla's safe-to-deploy deltas reach 0.2.176."

[[exemptions.memchr]]
version = "2.8.3"
criteria = "safe-to-deploy"
notes = "No full audit in the imported sets as of 2026-10-09; Zcash's safe-to-deploy deltas reach 2.7.5."

[[exemptions.sha2]]
version = "0.11.1"
criteria = "safe-to-deploy"
notes = "Ships in pubrel through publet-core 0.1.4 (content identifiers) and ed25519-dalek 3. Imported audits cover 0.10.2 (ISRG) and deltas to 0.10.9; nothing covers 0.10.9 to 0.11.1 (51 files, +1965/-1214). Released 2026-10-12; MSRV 1.88, pubrel's own. 39 unsafe uses in src (SIMD and asm backends). No advisory against 0.11.1 (OSV). As of 2026-10-28. Review by 2027-01-28."

[[exemptions.signature]]
version = "3.0.0"
criteria = "safe-to-deploy"
notes = "Ships in pubrel through publet-core 0.1.4 (via ed25519 3). Zcash audited 2.1.0 and the delta to 2.2.0; nothing covers 2.2.0 to 3.0.0 (12 files, +649/-451). forbid(unsafe_code). No advisory. As of 2026-10-28. Review by 2027-01-28."

[[exemptions.typenum]]
version = "1.20.1"
criteria = "safe-to-deploy"
notes = "Mozilla and Zcash published safe-to-deploy deltas 1.15.0 to 1.17.0; nothing covers 1.17.0 to this version, and no set has a full audit. Most of the crate is generated code. As of 2026-10-05."
