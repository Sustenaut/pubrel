# Written by `pubkit sync` from the ci block of pubkit.json. Do not edit:
# change pubkit.json and run `pubkit sync`.
name: main

on:
  push: { branches: [main] }

permissions:
  contents: read

jobs:
  # Whether an earlier run already passed on this commit's tree: then the
  # jobs it ran are skipped, and nothing here tests less than it did.
  tested:
    name: ci
    uses: Sustenaut/pubkit/.github/workflows/job-tested.yml@74ab84e90fc8b6f691ef4b3d717a9e838d49e4a8 # v0.34.0
    with: {"workflow": ".github/workflows/queue.yml"}
    permissions:
      actions: read
      contents: read

  gates:
    name: ci
    needs: [tested]
    if: ${{ needs.tested.outputs.tested != 'true' }}
    uses: Sustenaut/pubkit/.github/workflows/job-rust-gates.yml@74ab84e90fc8b6f691ef4b3d717a9e838d49e4a8 # v0.34.0
    with: {"required": "fmt-check lint doc publish-check"}

  test:
    name: ci
    needs: [tested, gates]
    if: ${{ needs.tested.outputs.tested != 'true' }}
    uses: Sustenaut/pubkit/.github/workflows/job-rust-test.yml@74ab84e90fc8b6f691ef4b3d717a9e838d49e4a8 # v0.34.0

  functional:
    name: ci
    needs: [tested, gates]
    if: ${{ needs.tested.outputs.tested != 'true' }}
    uses: Sustenaut/pubkit/.github/workflows/job-rust-functional.yml@74ab84e90fc8b6f691ef4b3d717a9e838d49e4a8 # v0.34.0
    with: {"required": "functional supply-chain-check", "tools": "[{\"crate\": \"publet-cli\", \"git\": \"https://github.com/Sustenaut/publet\", \"tag\": \"v0.4.0\"}]"}
    secrets: { SONAR_TOKEN: '${{ secrets.SONAR_TOKEN }}' }

  msrv:
    name: ci
    needs: [tested, gates]
    if: ${{ needs.tested.outputs.tested != 'true' }}
    uses: Sustenaut/pubkit/.github/workflows/job-rust-msrv.yml@74ab84e90fc8b6f691ef4b3d717a9e838d49e4a8 # v0.34.0

  fuzz:
    name: ci
    needs: [tested, gates]
    if: ${{ needs.tested.outputs.tested != 'true' }}
    uses: Sustenaut/pubkit/.github/workflows/job-rust-fuzz.yml@74ab84e90fc8b6f691ef4b3d717a9e838d49e4a8 # v0.34.0

  cross:
    name: ci
    needs: [tested, gates]
    if: ${{ needs.tested.outputs.tested != 'true' }}
    uses: Sustenaut/pubkit/.github/workflows/job-rust-cross.yml@74ab84e90fc8b6f691ef4b3d717a9e838d49e4a8 # v0.34.0

  audit:
    name: ci
    needs: [tested]
    if: ${{ needs.tested.outputs.tested != 'true' }}
    uses: Sustenaut/pubkit/.github/workflows/job-rust-audit.yml@74ab84e90fc8b6f691ef4b3d717a9e838d49e4a8 # v0.34.0
    with: {"required": "deny vet"}

  osv:
    name: ci
    needs: [tested]
    if: ${{ needs.tested.outputs.tested != 'true' }}
    uses: Sustenaut/pubkit/.github/workflows/job-osv.yml@74ab84e90fc8b6f691ef4b3d717a9e838d49e4a8 # v0.34.0

  sonar:
    name: ci
    needs: [tested, functional]
    if: ${{ !failure() && !cancelled() }}
    uses: Sustenaut/pubkit/.github/workflows/job-sonar.yml@74ab84e90fc8b6f691ef4b3d717a9e838d49e4a8 # v0.34.0
    permissions:
      actions: read
      contents: read
    with: {"reports": "sonar.rust.lcov.reportPaths=lcov.info sonar.python.coverage.reportPaths=*.xml", "layout": "-Dsonar.sources=src -Dsonar.tests=tests,fuzz", "coverage-run": "${{ needs.tested.outputs.run-id }}"}
    secrets: { SONAR_TOKEN: '${{ secrets.SONAR_TOKEN }}' }

  # The one check a ruleset requires: it passes only when every job
  # above succeeded or, where an earlier run already passed on the
  # commit's tree, was skipped for it. None is skipped for not being asked for.
  passed:
    name: ci / passed
    if: always()
    needs: [tested, gates, test, functional, msrv, fuzz, cross, audit, osv, sonar]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e --arg tested "$TESTED" '.tested.result == "success"
            and all(.[]; .result == "success" or (.result == "skipped" and $tested == "true"))' > /dev/null
        env: { RESULTS: '${{ toJSON(needs) }}', TESTED: '${{ needs.tested.outputs.tested }}' }

  # The repository's own release workflow, built from this checkout,
  # so a change to it is tested here before a release carries it to
  # anyone else.
  release:
    needs: passed
    if: ${{ !cancelled() && needs.passed.result == 'success' }}
    uses: ./.github/workflows/release.yml
    secrets: { RELEASE_APP_ID: '${{ secrets.RELEASE_APP_ID }}', RELEASE_APP_KEY: '${{ secrets.RELEASE_APP_KEY }}' }
    permissions:
      contents: write
