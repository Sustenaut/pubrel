# Written by `pubkit sync` from the ci block of pubkit.json. Do not edit:
# change pubkit.json and run `pubkit sync`.
name: main

on:
  push: { branches: [main] }

permissions:
  contents: read

jobs:
  gates:
    name: ci
    uses: Sustenaut/pubkit/.github/workflows/job-rust-gates.yml@16cb82e94b7fc4f56dd1d545e289994f63eaba6a # v0.17.1
    with: {"required": "fmt-check lint doc publish-check"}

  test:
    name: ci
    needs: [gates]
    uses: Sustenaut/pubkit/.github/workflows/job-rust-test.yml@16cb82e94b7fc4f56dd1d545e289994f63eaba6a # v0.17.1

  functional:
    name: ci
    needs: [gates]
    uses: Sustenaut/pubkit/.github/workflows/job-rust-functional.yml@16cb82e94b7fc4f56dd1d545e289994f63eaba6a # v0.17.1
    with: {"pub-version": "v0.2.1", "required": "functional supply-chain-check"}
    secrets: { SONAR_TOKEN: '${{ secrets.SONAR_TOKEN }}' }

  msrv:
    name: ci
    needs: [gates]
    uses: Sustenaut/pubkit/.github/workflows/job-rust-msrv.yml@16cb82e94b7fc4f56dd1d545e289994f63eaba6a # v0.17.1

  fuzz:
    name: ci
    needs: [gates]
    uses: Sustenaut/pubkit/.github/workflows/job-rust-fuzz.yml@16cb82e94b7fc4f56dd1d545e289994f63eaba6a # v0.17.1

  cross:
    name: ci
    needs: [gates]
    uses: Sustenaut/pubkit/.github/workflows/job-rust-cross.yml@16cb82e94b7fc4f56dd1d545e289994f63eaba6a # v0.17.1

  audit:
    name: ci
    uses: Sustenaut/pubkit/.github/workflows/job-rust-audit.yml@16cb82e94b7fc4f56dd1d545e289994f63eaba6a # v0.17.1
    with: {"required": "deny vet"}

  osv:
    name: ci
    uses: Sustenaut/pubkit/.github/workflows/job-osv.yml@16cb82e94b7fc4f56dd1d545e289994f63eaba6a # v0.17.1

  sonar:
    name: ci
    needs: [functional]
    uses: Sustenaut/pubkit/.github/workflows/job-sonar.yml@16cb82e94b7fc4f56dd1d545e289994f63eaba6a # v0.17.1
    with: {"reports": "sonar.rust.lcov.reportPaths=lcov.info sonar.python.coverage.reportPaths=*.xml", "layout": "-Dsonar.sources=src -Dsonar.tests=tests,fuzz"}
    secrets: { SONAR_TOKEN: '${{ secrets.SONAR_TOKEN }}' }

  # The one check a ruleset requires: it passes only when every job
  # above succeeded. None of them is ever skipped for not being asked for.
  passed:
    name: ci / passed
    if: always()
    needs: [gates, test, functional, msrv, fuzz, cross, audit, osv, sonar]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
        env: { RESULTS: '${{ toJSON(needs) }}' }

  # The repository's own release workflow, built from this checkout,
  # so a change to it is tested here before a release carries it to
  # anyone else.
  release:
    needs: passed
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
