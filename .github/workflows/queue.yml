# Written by `pubkit sync` from the ci block of pubkit.json. Do not edit:
# change pubkit.json and run `pubkit sync`.
name: queue

on:
  merge_group:

permissions:
  contents: read

jobs:
  gates:
    name: ci
    uses: Sustenaut/pubkit/.github/workflows/job-rust-gates.yml@2ed3af00875f91f6130a6ad7e8841554e0a6b8fc # v0.37.1
    with: {"required": "fmt-check lint doc publish-check"}

  test:
    name: ci
    needs: [gates]
    uses: Sustenaut/pubkit/.github/workflows/job-rust-test.yml@2ed3af00875f91f6130a6ad7e8841554e0a6b8fc # v0.37.1

  functional:
    name: ci
    needs: [gates]
    uses: Sustenaut/pubkit/.github/workflows/job-rust-functional.yml@2ed3af00875f91f6130a6ad7e8841554e0a6b8fc # v0.37.1
    with: {"required": "functional supply-chain-check", "tools": "[{\"crate\": \"publet-cli\", \"git\": \"https://github.com/Sustenaut/publet\", \"tag\": \"v0.4.0\"}]"}
    secrets: { SONAR_TOKEN: '${{ secrets.SONAR_TOKEN }}' }

  msrv:
    name: ci
    needs: [gates]
    uses: Sustenaut/pubkit/.github/workflows/job-rust-msrv.yml@2ed3af00875f91f6130a6ad7e8841554e0a6b8fc # v0.37.1

  fuzz:
    name: ci
    needs: [gates]
    uses: Sustenaut/pubkit/.github/workflows/job-rust-fuzz.yml@2ed3af00875f91f6130a6ad7e8841554e0a6b8fc # v0.37.1

  cross:
    name: ci
    needs: [gates]
    uses: Sustenaut/pubkit/.github/workflows/job-rust-cross.yml@2ed3af00875f91f6130a6ad7e8841554e0a6b8fc # v0.37.1

  audit:
    name: ci
    uses: Sustenaut/pubkit/.github/workflows/job-rust-audit.yml@2ed3af00875f91f6130a6ad7e8841554e0a6b8fc # v0.37.1
    with: {"required": "deny vet"}

  osv:
    name: ci
    uses: Sustenaut/pubkit/.github/workflows/job-osv.yml@2ed3af00875f91f6130a6ad7e8841554e0a6b8fc # v0.37.1

  # The one check a ruleset requires: it passes only when every job
  # above succeeded. None of them is ever skipped for not being asked for.
  passed:
    name: ci / passed
    if: always()
    needs: [gates, test, functional, msrv, fuzz, cross, audit, osv]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
        env: { RESULTS: '${{ toJSON(needs) }}' }

  # The repository's own release workflow, built from this checkout,
  # so a change to it is tested here before a release carries it to
  # anyone else.
  release:
    needs: passed
    uses: ./.github/workflows/release.yml
    secrets: { RELEASE_APP_ID: '${{ secrets.RELEASE_APP_ID }}', RELEASE_APP_KEY: '${{ secrets.RELEASE_APP_KEY }}' }
    permissions:
      contents: write
