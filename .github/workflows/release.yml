# The release workflow every package calls:
#
#   release:
#     uses: Sustenaut/pubrel/.github/workflows/release.yml@vX.Y.Z
#     with: { pubrel-version: vX.Y.Z }
#
# On a pull request, `pubrel check` holds the change to the rules: code
# changes record what they change; a release is the bump its changes
# require, and published. On main, `pubrel tag` tags and releases a
# version the package publet records as released. Both read the package
# publet and verify its signatures in-process, so no `pub` is installed.
# A crate whose release.json entry sets semver-checks also has its public
# API checked against its last release: pass semver-checks-version.
# Nothing here signs: a release is signed when its package publet is
# published, locally.
#
# A main branch whose tags a ruleset protects needs a pusher the ruleset
# lets through, and an organization cannot name GitHub Actions as a
# bypass actor. Pass a release GitHub App (contents: write) as
# RELEASE_APP_ID and RELEASE_APP_KEY, name the app as the ruleset's bypass
# actor, and the tag step pushes the tag and creates the release as the
# app. Without them it uses the workflow's own token, as before. Only a
# push to main mints the app's token: pull request and merge queue runs
# never tag.
name: release

on:
  workflow_call:
    inputs:
      pub-version:
        description: Ignored; kept so callers that still pass it keep working. pubrel no longer needs pub in CI.
        type: string
        default: ''
      pubrel-version:
        description: The pubrel release to install (vX.Y.Z); empty builds it from this checkout. 0.5.0 and later come from crates.io, earlier ones from their git tag.
        type: string
        default: ''
      semver-checks-version:
        description: The cargo-semver-checks version to install, for packages whose release.json entry sets semver-checks; empty installs none.
        type: string
        default: ''
    secrets:
      RELEASE_APP_ID:
        description: The release GitHub App's id. With RELEASE_APP_KEY, main tags and releases as the app.
        required: false
      RELEASE_APP_KEY:
        description: The release GitHub App's private key (PEM).
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Secrets cannot appear in a step's if, so say here whether both are set.
      TAG_AS_APP: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.RELEASE_APP_ID != '' && secrets.RELEASE_APP_KEY != '' }}
    steps:
      # A token for this repository alone, that can do no more than write
      # its contents: push the tag and create the release.
      - name: Mint the release app's token
        id: app
        if: env.TAG_AS_APP == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      # The checkout keeps its token for git, so `pubrel tag`'s push goes
      # as the app when there is one.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token || github.token }}
      - if: inputs.pubrel-version != ''
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/pubrel
          key: pubrel-${{ inputs.pubrel-version }}-${{ runner.os }}
      - name: Install pubrel
        run: |
          if [ -n "$INPUT_PUBREL" ]; then
            version="${INPUT_PUBREL#v}"
            if command -v pubrel >/dev/null && pubrel --version | grep -q "^pubrel ${version}$"; then
              :
            elif [ "$(printf '%s\n0.5.0\n' "$version" | sort -V | head -1)" = 0.5.0 ]; then
              # Published to crates.io from 0.5.0: the same source as the tag.
              cargo install --locked pubrel --version "$version"
            else
              cargo install --locked --git https://github.com/Sustenaut/pubrel --tag "$INPUT_PUBREL" pubrel
            fi
          else
            cargo install --locked --path .
          fi
          pubrel --version
        env:
          INPUT_PUBREL: ${{ inputs.pubrel-version }}
      - if: inputs.semver-checks-version != ''
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-semver-checks
          key: cargo-semver-checks-${{ inputs.semver-checks-version }}-${{ runner.os }}
      - name: Install cargo-semver-checks
        if: inputs.semver-checks-version != ''
        run: |
          command -v cargo-semver-checks >/dev/null \
            && cargo-semver-checks --version | grep -q " ${INPUT_SEMVER}$" \
            || cargo install --locked cargo-semver-checks --version "$INPUT_SEMVER"
          cargo-semver-checks --version
        env:
          INPUT_SEMVER: ${{ inputs.semver-checks-version }}
      - name: Check this change against the release rules
        if: github.event_name == 'pull_request'
        run: pubrel check "origin/${{ github.base_ref }}"
      - name: Tag and release what main publishes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -n "$APP_SLUG" ]; then
            # The tag's tagger is the app's bot account.
            bot="$APP_SLUG[bot]"
            id="$(gh api "users/$bot" --jq .id)"
            git config user.name "$bot"
            git config user.email "$id+$bot@users.noreply.github.com"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi
          pubrel tag
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
