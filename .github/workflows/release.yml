# The release workflow every package calls:
#
#   release:
#     uses: schryer/pubrel/.github/workflows/release.yml@vX.Y.Z
#     with: { pubrel-version: vX.Y.Z }
#
# On a pull request, `pubrel check` holds the change to the rules: code
# changes record what they change; a release is the bump its changes
# require, and published. On main, `pubrel tag` tags and releases a
# version the package publet records as released. Both read the package
# publet and verify its signatures in-process, so no `pub` is installed.
# A crate whose release.json entry sets semver-checks also has its public
# API checked against its last release: pass semver-checks-version.
# Nothing here signs: a release is signed when its package publet is
# published, locally.
name: release

on:
  workflow_call:
    inputs:
      pub-version:
        description: Ignored; kept so callers that still pass it keep working. pubrel no longer needs pub in CI.
        type: string
        default: ''
      pubrel-version:
        description: The pubrel release to install (vX.Y.Z); empty builds it from this checkout. 0.5.0 and later come from crates.io, earlier ones from their git tag.
        type: string
        default: ''
      semver-checks-version:
        description: The cargo-semver-checks version to install, for packages whose release.json entry sets semver-checks; empty installs none.
        type: string
        default: ''

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - if: inputs.pubrel-version != ''
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/pubrel
          key: pubrel-${{ inputs.pubrel-version }}-${{ runner.os }}
      - name: Install pubrel
        run: |
          if [ -n "$INPUT_PUBREL" ]; then
            version="${INPUT_PUBREL#v}"
            if command -v pubrel >/dev/null && pubrel --version | grep -q "^pubrel ${version}$"; then
              :
            elif [ "$(printf '%s\n0.5.0\n' "$version" | sort -V | head -1)" = 0.5.0 ]; then
              # Published to crates.io from 0.5.0: the same source as the tag.
              cargo install --locked pubrel --version "$version"
            else
              cargo install --locked --git https://github.com/schryer/pubrel --tag "$INPUT_PUBREL" pubrel
            fi
          else
            cargo install --locked --path .
          fi
          pubrel --version
        env:
          INPUT_PUBREL: ${{ inputs.pubrel-version }}
      - if: inputs.semver-checks-version != ''
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-semver-checks
          key: cargo-semver-checks-${{ inputs.semver-checks-version }}-${{ runner.os }}
      - name: Install cargo-semver-checks
        if: inputs.semver-checks-version != ''
        run: |
          command -v cargo-semver-checks >/dev/null \
            && cargo-semver-checks --version | grep -q " ${INPUT_SEMVER}$" \
            || cargo install --locked cargo-semver-checks --version "$INPUT_SEMVER"
          cargo-semver-checks --version
        env:
          INPUT_SEMVER: ${{ inputs.semver-checks-version }}
      - name: Check this change against the release rules
        if: github.event_name == 'pull_request'
        run: pubrel check "origin/${{ github.base_ref }}"
      - name: Tag and release what main publishes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pubrel tag
        env:
          GH_TOKEN: ${{ github.token }}
