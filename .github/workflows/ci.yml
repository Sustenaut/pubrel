name: ci

on:
  push: { branches: [main] }
  pull_request:
  # Nightly: the same checks, plus longer fuzzing and the tests on the
  # latest stable and beta Rust, so new advisories and a new Rust that
  # breaks the build show up within a day.
  schedule: [{ cron: '41 3 * * *' }]
  workflow_dispatch:

jobs:
  # pubkit's shared Rust CI. It runs every check the Rust crate standard
  # requires (`make required` lists them): fmt, clippy, docs and packaging;
  # the tests on Linux, macOS, Windows, i686 and s390x; the Gherkin suite
  # against a released pub, and the supply-chain report; the oldest
  # promised Rust; fuzzing of what `check` reads from a pull request, after
  # replaying every input that once found a bug; and cargo deny and vet.
  ci:
    uses: schryer/pubkit/.github/workflows/rust-ci.yml@v0.6.0
    with:
      pub-version: v0.2.0

  # cargo deny and cargo vet. ci's own audit job now runs the same; this
  # one stays while the branch ruleset requires a check named `audit`.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo install --locked cargo-deny --version 0.20.2
      - run: make deny
      - run: cargo install --locked cargo-vet --version 0.10.2
      - run: make vet

  # pubrel is held to its own rules, by its own workflow, built from this
  # checkout -- so a change to the workflow is tested before a release
  # carries it to anyone else.
  release:
    needs: [ci, audit]
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
