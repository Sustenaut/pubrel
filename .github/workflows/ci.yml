name: ci

on:
  push: { branches: [main] }
  pull_request:
  # Nightly: the same checks, plus longer fuzzing and the tests on the
  # latest stable and beta Rust, so new advisories and a new Rust that
  # breaks the build show up within a day.
  schedule: [{ cron: '41 3 * * *' }]
  workflow_dispatch:

jobs:
  # The shared Rust CI: gates, cargo test on three platforms, the Gherkin
  # suite against a released pub, and:
  # - fuzz: what `check` reads from a pull request (fuzz/), after replaying
  #   every input that once found a bug;
  # - msrv: a build on the oldest Rust pubrel promises, its rust-version;
  # - cross: the tests on a 32-bit and a big-endian machine.
  ci:
    uses: schryer/pubkit/.github/workflows/rust-ci.yml@v0.3.1
    with:
      pub-version: v0.2.0
      fuzz: true
      msrv: true
      cross-targets: '["i686-unknown-linux-gnu", "s390x-unknown-linux-gnu"]'

  # Advisories, licences and sources (cargo deny), and every dependency
  # audited, trusted or exempt with its evidence (cargo vet).
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo install --locked cargo-deny --version 0.20.2
      - run: make deny
      - run: cargo install --locked cargo-vet --version 0.10.2
      - run: make vet

  # pubrel is held to its own rules, by its own workflow, built from this
  # checkout -- so a change to the workflow is tested before a release
  # carries it to anyone else.
  release:
    needs: [ci, audit]
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
