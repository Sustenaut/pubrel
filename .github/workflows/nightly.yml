# Written by `pubkit sync` from the ci block of pubkit.json. Do not edit:
# change pubkit.json and run `pubkit sync`.
name: nightly

on:
  schedule: [{ cron: '41 3 * * *' }]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    name: ci
    uses: Sustenaut/pubkit/.github/workflows/job-rust-gates.yml@ec25e7ea8a86d688a626b0326fb131c11b6da081 # v0.36.0
    with: {"required": "fmt-check lint doc publish-check"}

  test:
    name: ci
    needs: [gates]
    uses: Sustenaut/pubkit/.github/workflows/job-rust-test.yml@ec25e7ea8a86d688a626b0326fb131c11b6da081 # v0.36.0

  functional:
    name: ci
    needs: [gates]
    uses: Sustenaut/pubkit/.github/workflows/job-rust-functional.yml@ec25e7ea8a86d688a626b0326fb131c11b6da081 # v0.36.0
    with: {"required": "functional supply-chain-check", "tools": "[{\"crate\": \"publet-cli\", \"git\": \"https://github.com/Sustenaut/publet\", \"tag\": \"v0.4.0\"}]"}
    secrets: { SONAR_TOKEN: '${{ secrets.SONAR_TOKEN }}' }

  msrv:
    name: ci
    needs: [gates]
    uses: Sustenaut/pubkit/.github/workflows/job-rust-msrv.yml@ec25e7ea8a86d688a626b0326fb131c11b6da081 # v0.36.0

  fuzz:
    name: ci
    needs: [gates]
    uses: Sustenaut/pubkit/.github/workflows/job-rust-fuzz.yml@ec25e7ea8a86d688a626b0326fb131c11b6da081 # v0.36.0

  cross:
    name: ci
    needs: [gates]
    uses: Sustenaut/pubkit/.github/workflows/job-rust-cross.yml@ec25e7ea8a86d688a626b0326fb131c11b6da081 # v0.36.0

  audit:
    name: ci
    uses: Sustenaut/pubkit/.github/workflows/job-rust-audit.yml@ec25e7ea8a86d688a626b0326fb131c11b6da081 # v0.36.0
    with: {"required": "deny vet"}

  osv:
    name: ci
    uses: Sustenaut/pubkit/.github/workflows/job-osv.yml@ec25e7ea8a86d688a626b0326fb131c11b6da081 # v0.36.0

  toolchains:
    name: ci
    needs: [gates]
    uses: Sustenaut/pubkit/.github/workflows/job-rust-toolchains.yml@ec25e7ea8a86d688a626b0326fb131c11b6da081 # v0.36.0

  sonar:
    name: ci
    needs: [functional]
    uses: Sustenaut/pubkit/.github/workflows/job-sonar.yml@ec25e7ea8a86d688a626b0326fb131c11b6da081 # v0.36.0
    with: {"reports": "sonar.rust.lcov.reportPaths=lcov.info sonar.python.coverage.reportPaths=*.xml", "layout": "-Dsonar.sources=src -Dsonar.tests=tests,fuzz"}
    secrets: { SONAR_TOKEN: '${{ secrets.SONAR_TOKEN }}' }

  # The one check a ruleset requires: it passes only when every job
  # above succeeded. None of them is ever skipped for not being asked for.
  passed:
    name: ci / passed
    if: always()
    needs: [gates, test, functional, msrv, fuzz, cross, audit, osv, toolchains, sonar]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
        env: { RESULTS: '${{ toJSON(needs) }}' }
