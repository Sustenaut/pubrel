# Written by `pubrules sync` from the ci block of pubrules.json. Do not edit:
# change pubrules.json and run `pubrules sync`.
name: nightly

on:
  schedule: [{ cron: '41 3 * * *' }]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    name: ci
    uses: Sustenaut/pubrules/.github/workflows/job-rust-gates.yml@aba4735b621721fe2e1d96f83fcd012bb7244e34 # v0.45.1
    with: {"required": "fmt-check lint doc publish-check"}

  test:
    name: ci
    needs: [gates]
    uses: Sustenaut/pubrules/.github/workflows/job-rust-test.yml@aba4735b621721fe2e1d96f83fcd012bb7244e34 # v0.45.1

  functional:
    name: ci
    needs: [gates]
    uses: Sustenaut/pubrules/.github/workflows/job-rust-functional.yml@aba4735b621721fe2e1d96f83fcd012bb7244e34 # v0.45.1
    with: {"required": "functional supply-chain-check", "tools": "[{\"crate\": \"publet-cli\", \"git\": \"https://github.com/Sustenaut/publet\", \"tag\": \"v0.4.0\"}]"}
    secrets: { SONAR_TOKEN: '${{ secrets.SONAR_TOKEN }}' }

  msrv:
    name: ci
    needs: [gates]
    uses: Sustenaut/pubrules/.github/workflows/job-rust-msrv.yml@aba4735b621721fe2e1d96f83fcd012bb7244e34 # v0.45.1

  fuzz:
    name: ci
    needs: [gates]
    uses: Sustenaut/pubrules/.github/workflows/job-rust-fuzz.yml@aba4735b621721fe2e1d96f83fcd012bb7244e34 # v0.45.1

  cross:
    name: ci
    needs: [gates]
    uses: Sustenaut/pubrules/.github/workflows/job-rust-cross.yml@aba4735b621721fe2e1d96f83fcd012bb7244e34 # v0.45.1

  audit:
    name: ci
    uses: Sustenaut/pubrules/.github/workflows/job-rust-audit.yml@aba4735b621721fe2e1d96f83fcd012bb7244e34 # v0.45.1
    with: {"required": "deny vet"}

  osv:
    name: ci
    uses: Sustenaut/pubrules/.github/workflows/job-osv.yml@aba4735b621721fe2e1d96f83fcd012bb7244e34 # v0.45.1

  toolchains:
    name: ci
    needs: [gates]
    uses: Sustenaut/pubrules/.github/workflows/job-rust-toolchains.yml@aba4735b621721fe2e1d96f83fcd012bb7244e34 # v0.45.1

  sonar:
    name: ci
    needs: [functional]
    uses: Sustenaut/pubrules/.github/workflows/job-sonar.yml@aba4735b621721fe2e1d96f83fcd012bb7244e34 # v0.45.1
    with: {"reports": "sonar.rust.lcov.reportPaths=lcov.info sonar.python.coverage.reportPaths=*.xml", "layout": "-Dsonar.sources=src -Dsonar.tests=tests,fuzz"}
    secrets: { SONAR_TOKEN: '${{ secrets.SONAR_TOKEN }}' }

  # The one check a ruleset requires: it passes only when every job
  # above succeeded. None of them is ever skipped for not being asked for.
  passed:
    name: ci / passed
    if: always()
    needs: [gates, test, functional, msrv, fuzz, cross, audit, osv, toolchains, sonar]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
        env: { RESULTS: '${{ toJSON(needs) }}' }
