# Fuzz targets for what pubrel reads from a pull request. `pubrel check`
# runs in CI on a branch's content, so release.json, unreleased changes, the
# corpus lock and the manifests are untrusted input. A workspace of its own:
# it needs a nightly compiler and libFuzzer, and none of its dependencies
# belong in pubrel's supply chain.
#
#   cargo +nightly fuzz run release_json      # until stopped
#   make fuzz-smoke                           # every target briefly
[package]
name = "pubrel-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# The same versions pubrel depends on: the modules under test are pubrel's
# own source files, compiled here (src/lib.rs).
[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
publet-core = "0.1.4"
semver = "1"
serde_json = "1"
toml_edit = "0.22"

[workspace]

[[bin]]
name = "release_json"
path = "fuzz_targets/release_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "unreleased_json"
path = "fuzz_targets/unreleased_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "corpus_lock"
path = "fuzz_targets/corpus_lock.rs"
test = false
doc = false
bench = false

[[bin]]
name = "manifest"
path = "fuzz_targets/manifest.rs"
test = false
doc = false
bench = false
